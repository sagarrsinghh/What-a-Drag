name: CI Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: drag-clothing-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./drag-clothing-backend
        run: npm ci

      - name: Build backend
        working-directory: ./drag-clothing-backend
        run: npm run build

  build-frontend:
    name: Build Frontend (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: drag-clothing-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./drag-clothing-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./drag-clothing-frontend
        run: npm run build
